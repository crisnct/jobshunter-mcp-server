services:
  jobshunter-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobshunter-mcp-server
    networks:
      - default
      - jobshunter-net
    ports:
      - "9002:8081"
    environment:
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-notset}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-notset}"
      MCP_AS_ACCESS_TOKEN_TTL: "${MCP_AS_ACCESS_TOKEN_TTL:-15m}"
      MCP_AS_SIGNING_KEY_PEM: "${MCP_AS_SIGNING_KEY_PEM:-}"
      MCP_AS_DELEGATED_TOKEN_TTL: "${MCP_AS_DELEGATED_TOKEN_TTL:-5m}"
      MCP_AS_KEY_ID: "${MCP_AS_KEY_ID:-notset}"
      JOBSHUNTER_BASE_URL: "https://ronin-archesporial-lonnie.ngrok-free.dev"
      JOBSHUNTER_CONNECT_TIMEOUT: "5s"
      JOBSHUNTER_RESPONSE_TIMEOUT: "25m"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  jobshunter-net:
    external: true

