services:
  jobshunter-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobshunter-mcp-server
    networks:
      - default
      - jobshunter-net
    ports:
      - "9002:8081"
    environment:
      GOOGLE_ISSUER_URI: "https://accounts.google.com"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-notset}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-notset}"
      MCP_GOOGLE_AUDIENCE: "${MCP_GOOGLE_AUDIENCE}"
      MCP_REQUIRED_SCOPE: "${MCP_REQUIRED_SCOPE:-}"
      MCP_OAUTH_SCOPE: "${MCP_OAUTH_SCOPE:-openid email profile}"
      MCP_OAUTH_GOOGLE_AUTH_ENDPOINT: "${MCP_OAUTH_GOOGLE_AUTH_ENDPOINT:-https://accounts.google.com/o/oauth2/v2/auth}"
      MCP_OAUTH_GOOGLE_TOKEN_ENDPOINT: "${MCP_OAUTH_GOOGLE_TOKEN_ENDPOINT:-https://oauth2.googleapis.com/token}"
      JOBSHUNTER_BASE_URL: "https://ronin-archesporial-lonnie.ngrok-free.dev"
      JOBSHUNTER_SEARCH_JOBS_PATH: "/api/internal/search_jobs"
      JOBSHUNTER_USER_INFO_PATH: "/api/internal/me"
      JOBSHUNTER_CONNECT_TIMEOUT: "5s"
      JOBSHUNTER_RESPONSE_TIMEOUT: "25m"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  jobshunter-net:
    external: true

