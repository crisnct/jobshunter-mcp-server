name: Compile Agentic Workflows

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gh-aw extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw

      - name: Compile workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- .github/workflows/*.lock.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request with recompiled lock files
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="chore/compile-agentic-workflows-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .github/workflows/*.lock.yml
          git commit -m "chore: recompile agentic workflow lock files"
          git push origin "$branch"
          gh pr create \
            --title "chore: recompile agentic workflow lock files" \
            --body "Automated recompilation via \`gh aw compile\`, triggered manually from the Actions tab (run ${{ github.run_id }})." \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch"
