name: Compile Agentic Workflows

on:
  push:
    paths:
      - ".github/workflows/developer-agent.md"
      - ".github/workflows/reviewer-agent.md"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: compile-agentic-workflows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GH_AW_WORKFLOW_PAT }}

      - name: Install gh-aw extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw

      - name: Compile workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- .github/workflows/*.lock.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push recompiled lock files
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/*.lock.yml
          git commit -m "chore: recompile agentic workflow lock files"
          git push origin HEAD:${{ github.ref_name }}
