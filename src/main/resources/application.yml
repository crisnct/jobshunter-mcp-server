server:
  port: 8081

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${GOOGLE_ISSUER_URI:https://accounts.google.com}
  ai:
    mcp:
      server:
        name: jobshunter-mcp
        version: 1.0.0
        protocol: STREAMABLE
        type: SYNC
        request-timeout: 5m
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp

mcp:
  security:
    audience: ${MCP_GOOGLE_AUDIENCE:${GOOGLE_CLIENT_ID:notset}}
    required-scope: ${MCP_REQUIRED_SCOPE:}

jobshunter:
  # base-url: ${JOBSHUNTER_BASE_URL:https://localhost:8444}
  base-url: ${JOBSHUNTER_BASE_URL:https://ronin-archesporial-lonnie.ngrok-free.dev}
  search-jobs-path: ${JOBSHUNTER_SEARCH_JOBS_PATH:/api/internal/search_jobs}
  connect-timeout: ${JOBSHUNTER_CONNECT_TIMEOUT:5s}
  response-timeout: ${JOBSHUNTER_RESPONSE_TIMEOUT:25m}
  ssl:
    trust-store: classpath:ngrok-truststore.p12
    trust-store-password: changeit
    trust-store-type: PKCS12


