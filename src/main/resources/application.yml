server:
  port: 8081
  forward-headers-strategy: framework

spring:
  ai:
    mcp:
      server:
        name: jobshunter-mcp
        version: 1.0.0
        protocol: STREAMABLE
        type: SYNC
        request-timeout: 5m
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp

mcp:
  authorization-server:
    # Canonical public issuer/base URL for OAuth discovery metadata and MCP-minted JWT iss claim.
    # Must be a fixed externally reachable URL, not derived from request headers.
    issuer: ${MCP_AS_ISSUER:https://ronin-archesporial-lonnie.ngrok-free.dev}
    ## Audience for MCP access tokens used to authenticate requests to /mcp (must match MCP resource server validation).
    mcp-audience: mcp-api
    # Lifetime of the MCP access token issued for /mcp clients; shorter values reduce exposure if token is leaked.
    mcp-access-token-ttl: ${MCP_AS_ACCESS_TOKEN_TTL:15m}
    # token_use claim value set in MCP access tokens accepted on /mcp.
    mcp-access-token-use: mcp_access
    # Audience for delegated tokens sent from MCP to Jobshunter internal API (keep different from mcp-audience for security isolation).
    jobshunter-audience: jobshunter-internal-api
    # Lifetime of the delegated token used by MCP when calling Jobshunter API; keep short because it is a downstream service token.
    jobshunter-delegated-token-ttl: ${MCP_AS_DELEGATED_TOKEN_TTL:5m}
    # token_use claim value set in delegated JWTs minted by MCP for Jobshunter API calls.
    jobshunter-delegated-token-use: jobshunter_delegated
    # Optional PKCS#8 RSA private key (PEM/Base64) used to sign MCP-issued JWTs; if empty, an ephemeral key is generated at startup.
    signing-key-pem: ${MCP_AS_SIGNING_KEY_PEM:}
    # JWT key identifier (kid) attached to all MCP-signed tokens (including delegated Jobshunter tokens) and exposed in JWKS so verifiers can select the correct public key, especially during rotation.
    key-id: ${MCP_AS_KEY_ID:mcp-key-1}
  oauth:
    # Used by /authorize to redirect the client for user login/consent.
    google-authorization-endpoint: https://accounts.google.com/o/oauth2/v2/auth
    # Scopes requested from Google during authorization (drives claims available in id_token/user context).
    scope: openid email profile
    # Used by /token to exchange authorization code for tokens.
    google-token-endpoint: https://oauth2.googleapis.com/token
    # Used to fetch public keys for id_token signature verification.
    jwks-uri: https://www.googleapis.com/oauth2/v3/certs
    # Expected issuer for Google id_token validation (must match the 'iss' claim).
    google-issuer-uri: https://accounts.google.com
    # Client ID for Google OAuth 2.0 application.
    client-id: ${GOOGLE_CLIENT_ID:}
    # Client secret for Google OAuth 2.0 application.
    client-secret: ${GOOGLE_CLIENT_SECRET:}

jobshunter:
  base-url: ${JOBSHUNTER_BASE_URL:https://ronin-archesporial-lonnie.ngrok-free.dev}
  connect-timeout: ${JOBSHUNTER_CONNECT_TIMEOUT:5s}
  response-timeout: ${JOBSHUNTER_RESPONSE_TIMEOUT:25m}
  search-jobs-path: /api/internal/search_jobs
  user-info-path: /api/internal/me
  ssl:
    trust-store: classpath:ngrok-truststore.p12
    trust-store-password: changeit
    trust-store-type: PKCS12


